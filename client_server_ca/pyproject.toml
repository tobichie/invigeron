[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "securetransfer"
version = "0.1.0"
description = "Encrypted file transfer using RSA and AES-GCM"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "click>=8.1",
    "cryptography>=45.0",
    "pycryptodome>=3.23"
]

[project.scripts]
securetransfer-server = "securetransfer.server:main"
securetransfer-client = "securetransfer.client:main"